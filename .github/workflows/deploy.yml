# Deploys the app to GitHub Pages only when a release tag is pushed (e.g. v1.2.0).
# Requires: Settings → Pages → Source = "GitHub Actions".
name: Deploy to Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # also allows a manual deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publish only the app files (no TODO.md, CHANGELOG.md, .github, etc.)
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest *.png _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
