# Deploys the app to GitHub Pages only when a release tag is pushed (e.g. v1.2.0).
# Requires: Settings → Pages → Source = "GitHub Actions".
name: Deploy to Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # also allows a manual deploy from the Actions tab

permissions:
  contents: read
  actions: read   # deploy-pages looks up the uploaded artifact through the Actions API
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's Pages starter workflow: the deploy job starts only after the
# artifact upload of the build job is complete.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Publish only the app files (no TODO.md, CHANGELOG.md, .github, etc.)
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest *.png _site/
          # Show the release tag (e.g. v0.1.2) in the app settings
          sed -i "s/__APP_VERSION__/${GITHUB_REF_NAME}/" _site/index.html
          grep -q "APP_VERSION = '${GITHUB_REF_NAME}'" _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
